[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medical-ocr"
version = "0.1.0"
description = "R&D harness to extract structured data from hand-written medical images via multiple backends (VLM/Claude/Surya) and score against human ground truth"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Soumendra Daas" }]
# Pillow is required at runtime: litellm's Ollama provider decodes every image
# through PIL (an optional transitive dep of litellm), so we must declare it.
dependencies = ["litellm>=1.0", "Pillow>=10"]

[project.scripts]
medical-ocr = "medical_ocr.cli:main"
vlm-read = "medical_ocr.vlm_read:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/medical_ocr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
